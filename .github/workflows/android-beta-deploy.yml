name: Build & Deploy Android Beta (Manual)

on:
  workflow_dispatch:

jobs:
  android-firebase:
    name: Deploy Android beta
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    concurrency:
      group: android-firebase-distribution
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      VCPKG_ROOT: /Users/xf/vcpkg
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_GROUPS || 'internal' }}
      FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_TESTERS }}
      ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android release workflow contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/android_release_workflow_tests.py
      - name: Run fatal Android lint
        run: android/gradlew -p android lintFirebaseDebug
      - run: ./scripts/android_firebase_deploy.sh --variant firebaseRelease
