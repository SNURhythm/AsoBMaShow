name: Build & Deploy Mobile Betas

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  appstore:
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    name: Deploy iOS beta
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    strategy:
      matrix:
        ruby: ["3.4.9"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      # - run: security unlock-keychain -p '' ~/Library/Keychains/fastlane_tmp.keychain-db && /usr/bin/codesign --force --sign 34880200590025A82E9C5F3532E90943FF2C36D3 --generate-entitlement-der /Users/xf/Library/Developer/Xcode/DerivedData/AsoBMaShow-ctypzucmvdkvixehhworeabhoarv/Build/Intermediates.noindex/ArchiveIntermediates/AsoBMaShow/IntermediateBuildFilesPath/UninstalledProducts/iphoneos/SDL2.framework
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          self-hosted: true
      - run: ./scripts/ios_init.sh
      # - uses: mikehardy/buildcache-action@v2.1.0
      - working-directory: ./ios/Xcode/AsoBMaShow
        run: bundle exec fastlane ios beta --verbose
        env:
          FASTLANE_USER: zudevxf@gmail.com
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPACESHIP_ONLY_ALLOW_INTERACTIVE_2FA: 1
          APP_STORE_KEY: ${{ secrets.APP_STORE_KEY }}

  android-firebase:
    name: Deploy Android beta
    runs-on: [self-hosted, macOS]
    needs: appstore
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.appstore.result == 'success' }}
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      VCPKG_ROOT: /Users/xf/vcpkg
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_GROUPS || 'internal' }}
      FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_TESTERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./scripts/android_firebase_deploy.sh
