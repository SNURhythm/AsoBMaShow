name: Build & Deploy Mobile Betas

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  ios-verify:
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      VCPKG_ROOT: /Users/xf/vcpkg
    name: Verify iOS release candidate
    runs-on: [self-hosted, macOS]
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          self-hosted: true
      - run: ./scripts/ios_release_verify.sh

  ios-firebase:
    name: Distribute iOS PR to Firebase
    runs-on: [self-hosted, macOS]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}
    timeout-minutes: 30
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          self-hosted: true
      - run: ./scripts/ios_init.sh
      - working-directory: ./ios/Xcode/AsoBMaShow
        run: bundle exec fastlane ios firebase --verbose
        env:
          FASTLANE_USER: zudevxf@gmail.com
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPACESHIP_ONLY_ALLOW_INTERACTIVE_2FA: 1
          APP_STORE_KEY: ${{ secrets.APP_STORE_KEY }}

  ios-testflight:
    name: Distribute iOS build to TestFlight
    runs-on: [self-hosted, macOS]
    needs: ios-verify
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    concurrency:
      group: ios-testflight-distribution
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.9"
          self-hosted: true
      - run: ./scripts/ios_init.sh
      - working-directory: ./ios/Xcode/AsoBMaShow
        run: bundle exec fastlane ios testflight_release --verbose
        env:
          FASTLANE_USER: zudevxf@gmail.com
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPACESHIP_ONLY_ALLOW_INTERACTIVE_2FA: 1
          APP_STORE_KEY: ${{ secrets.APP_STORE_KEY }}

  android-firebase:
    name: Deploy Android beta
    runs-on: [self-hosted, macOS]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    timeout-minutes: 60
    concurrency:
      group: android-firebase-distribution
      cancel-in-progress: false
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      VCPKG_ROOT: /Users/xf/vcpkg
      FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_GROUPS || 'internal' }}
      FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ vars.FIREBASE_ANDROID_DISTRIBUTION_TESTERS }}
      ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android release workflow contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/android_release_workflow_tests.py
      - name: Run fatal Android lint
        run: android/gradlew -p android lintFirebaseDebug
      - run: ./scripts/android_firebase_deploy.sh --variant firebaseRelease
