name: Build macOS App Bundle

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ASOBMASHOW_MACOS_DEPLOYMENT_TARGET: "13.0"
  VCPKG_TOOL_COMMIT: 39344dff01c5a5a0134caf2624cdd492f05d30ea
  VCPKG_MANIFEST_BASELINE: 75a2e14262fc23c1f03bac18e135c4866dd25b51

jobs:
  build:
    name: Verify and package macOS app
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/') && 'macos-release' || format('macos-build-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      - name: Set job build directory
        run: echo "ASOBMASHOW_MACOS_BUILD_DIR=$RUNNER_TEMP/asobmashow-macos-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Beatoraja-compatible Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up CMake
        uses: lukka/get-cmake@v3.27.7
        with:
          cmakeVersion: "3.27.7"

      - name: Select optional compiler cache
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$RUNNER_TEMP/asobmashow-ccache" >> "$GITHUB_ENV"
          fi

      - name: Install pinned vcpkg tool
        run: |
          VCPKG_CHECKOUT="$RUNNER_TEMP/vcpkg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ ! -d "$VCPKG_CHECKOUT/.git" ]; then
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_CHECKOUT"
          fi
          git -C "$VCPKG_CHECKOUT" fetch origin "$VCPKG_TOOL_COMMIT" "$VCPKG_MANIFEST_BASELINE" --depth=1
          git -C "$VCPKG_CHECKOUT" checkout --detach "$VCPKG_TOOL_COMMIT"
          "$VCPKG_CHECKOUT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_CHECKOUT" >> "$GITHUB_ENV"

      - name: Generate user presets
        run: ./scripts/generate_user_presets.sh

      - name: Configure Release bundle
        run: ./scripts/macos_init.sh release ON

      - name: Build Release bundle and tests
        run: cmake --build "$ASOBMASHOW_MACOS_BUILD_DIR" --config Release -j"$(sysctl -n hw.ncpu)"

      - name: Run native and release contract tests
        run: |
          ctest --test-dir "$ASOBMASHOW_MACOS_BUILD_DIR" --output-on-failure -j"$(sysctl -n hw.ncpu)"
          PYTHONDONTWRITEBYTECODE=1 python3 tests/cross_platform_release_contract_tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/macos_artifact_audit_tests.py

      - name: Find app bundle
        id: find-bundle
        run: |
          APP_BUNDLE="$(find "$ASOBMASHOW_MACOS_BUILD_DIR" -name AsoBMaShow.app -type d -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "AsoBMaShow.app not found" >&2
            exit 1
          fi
          APP_BUNDLE="$(cd "$(dirname "$APP_BUNDLE")" && pwd -P)/$(basename "$APP_BUNDLE")"
          echo "bundle_path=$APP_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign verification bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          codesign --force --deep --options runtime --entitlements macos/AsoBMaShow.entitlements --sign - "${{ steps.find-bundle.outputs.bundle_path }}"

      - name: Developer ID sign tag bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CODESIGN_IDENTITY" ]; then
            echo "MACOS_CODESIGN_IDENTITY is required for a tagged macOS release" >&2
            exit 1
          fi
          security find-identity -v -p codesigning | grep -F -- "$MACOS_CODESIGN_IDENTITY"
          codesign --force --deep --options runtime --timestamp --entitlements macos/AsoBMaShow.entitlements --sign "$MACOS_CODESIGN_IDENTITY" "${{ steps.find-bundle.outputs.bundle_path }}"

      - name: Audit built app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/macos_artifact_audit.sh --require-signature "${{ steps.find-bundle.outputs.bundle_path }}"
          else
            scripts/macos_artifact_audit.sh "${{ steps.find-bundle.outputs.bundle_path }}"
          fi

      - name: Notarize and staple tag bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          if [ -z "$MACOS_NOTARY_KEY_ID" ] || [ -z "$MACOS_NOTARY_ISSUER_ID" ] || [ -z "$MACOS_NOTARY_KEY_P8" ]; then
            echo "MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID, and MACOS_NOTARY_KEY_P8 are required" >&2
            exit 1
          fi
          APP_BUNDLE="${{ steps.find-bundle.outputs.bundle_path }}"
          NOTARY_ARCHIVE="$RUNNER_TEMP/AsoBMaShow-notary.zip"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_$MACOS_NOTARY_KEY_ID.p8"
          trap 'rm -f "$NOTARY_KEY" "$NOTARY_ARCHIVE"' EXIT
          printf '%s' "$MACOS_NOTARY_KEY_P8" > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          ditto -c -k --keepParent "$APP_BUNDLE" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" --key "$NOTARY_KEY" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$APP_BUNDLE"
          scripts/macos_artifact_audit.sh --require-signature --require-gatekeeper "$APP_BUNDLE"

      - name: Package verified app bundle
        id: zip-bundle
        run: |
          APP_BUNDLE="${{ steps.find-bundle.outputs.bundle_path }}"
          ZIP_PATH="$(dirname "$APP_BUNDLE")/AsoBMaShow-macOS.zip"
          ditto -c -k --keepParent "$APP_BUNDLE" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload verification artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: AsoBMaShow-macOS
          path: ${{ steps.zip-bundle.outputs.zip_path }}
          retention-days: 30

      - name: Report package size
        run: |
          du -sh "${{ steps.find-bundle.outputs.bundle_path }}"
          ls -lh "${{ steps.zip-bundle.outputs.zip_path }}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ steps.zip-bundle.outputs.zip_path }}
